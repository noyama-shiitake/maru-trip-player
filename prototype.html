<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まるの旅</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    color-scheme: light dark;
    --panel:#ffffff; --panel-border:#dde3e8; --ink:#1d2530; --muted:#5d6874;
    --accent-train:#9e2b25; --accent-walk:#17705a; --accent:var(--accent-train);
    --chip:#eef1f4; --chip-ink:#3c4652; --track:#e3e8ec;
    --btn-ink:#ffffff; --shadow:0 6px 24px rgba(20,30,40,.18);
    --pin:var(--accent-train);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --panel:#171d24; --panel-border:#2c353f; --ink:#edf2f6; --muted:#9fadb9;
      --chip:#232c35; --chip-ink:#c6d2dc; --track:#2a333d;
      --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;color:var(--ink);background:#cfd8dc}
  button{font:inherit;cursor:pointer}
  #map{position:fixed;inset:0;z-index:0;background:#dfe7ea}
  .leaflet-container{font-family:inherit}
  /* ---------- base layer switcher (標準地図 / 航空写真) ---------- */
  /* 地図のすぐ上（共有カード内）に置く：右上のLeaflet配置ではデスクトップのシートや
     モバイルのトーストに隠れてしまうため、常時見えるカード内の一行にする */
  .basebar{display:flex;align-items:center;gap:9px;margin-top:10px}
  .basebar-label{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
  .base-switch{display:flex;gap:3px;flex:1;background:var(--chip);border:1px solid var(--panel-border);border-radius:999px;padding:3px}
  .base-switch button{flex:1;border:none;background:transparent;color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.2;padding:8px 13px;border-radius:999px;min-height:38px;white-space:nowrap}
  .base-switch button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
  .base-switch button:focus-visible{outline:2px solid var(--accent-train);outline-offset:2px}
  .leaflet-control-attribution{font-size:10.5px;line-height:1.4}
  /* ---------- album panel (地図ページ内に内蔵した自撮りアルバム) ---------- */
  /* 別ページへ遷移せず、このページ内のオーバーレイで開く。地図の状態はそのまま保持される */
  .album-btn{display:flex;width:100%;margin-top:9px;justify-content:center;min-height:48px;font-size:15px}
  #photoPanel{position:fixed;inset:0;z-index:850;background:var(--panel);color:var(--ink);
    display:flex;flex-direction:column;overscroll-behavior:contain}
  #photoPanel[hidden]{display:none}
  .pp-head{flex:none;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    border-bottom:1px solid var(--panel-border);background:var(--panel)}
  .pp-title{flex:1;font-size:19px;font-weight:700;line-height:1.25;margin:0}
  .pp-close{flex:none;min-height:44px;border:1.5px solid var(--panel-border);background:var(--chip);color:var(--chip-ink);
    border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
  .pp-close:focus-visible{outline:2px solid var(--accent-train);outline-offset:2px}
  .pp-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
  .pp-inner{max-width:860px;margin:0 auto}
  .pp-lead{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
  .pp-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pp-stat{background:var(--chip);border:1px solid var(--panel-border);border-radius:999px;
    padding:7px 13px;font-size:13.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
  .pp-stat span{color:var(--muted);font-weight:600;font-size:12.5px}
  .pp-progress{margin-top:12px;border:1px solid var(--panel-border);border-radius:12px;padding:11px 13px}
  .pp-progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .pp-progress-head b{font-size:14px}
  .pp-progress-head small{color:var(--muted);font-size:12.5px}
  .pp-bar{height:9px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:8px}
  .pp-bar i{display:block;height:100%;width:25.5%;background:var(--accent-walk);border-radius:999px}
  .pp-pref-list{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
  .pp-day{margin-top:26px}
  .pp-day-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .pp-day-head h3{font-size:17.5px;margin:0;font-weight:700}
  .pp-day-count{font-size:12px;color:#fff;background:var(--accent-walk);border-radius:999px;padding:3px 10px;font-weight:700}
  .pp-day-sub{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.6}
  .pp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:640px){ .pp-grid{grid-template-columns:repeat(3,1fr);gap:12px} }
  @media (min-width:900px){ .pp-grid{grid-template-columns:repeat(4,1fr)} }
  .pp-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;overflow:hidden;
    text-align:left;padding:0;cursor:pointer;font:inherit;color:inherit;display:block;width:100%}
  .pp-card:focus-visible{outline:2px solid var(--accent-train);outline-offset:2px}
  .pp-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--track)}
  .pp-card-body{display:block;padding:8px 10px 10px}
  .pp-card-place{display:block;font-weight:700;font-size:14px;line-height:1.35}
  .pp-card-pref{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .pp-foot{margin-top:26px;border-top:1px dashed var(--panel-border);padding-top:14px;color:var(--muted);font-size:13px;line-height:1.6}
  .pp-foot p{margin:4px 0}
  /* ---------- photo lightbox (パネル内の拡大表示) ---------- */
  #photoLb{position:fixed;inset:0;z-index:880;background:rgba(16,17,15,.95);color:#f5f4ee;
    display:flex;flex-direction:column}
  #photoLb[hidden]{display:none}
  .plb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
  .plb-counter{font-size:13px;color:#cfcdc2;font-weight:700;letter-spacing:.04em}
  .plb-close{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:999px;min-width:44px;min-height:44px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .plb-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 12px;position:relative}
  .plb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .plb-nav{position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(20,20,18,.55);color:#fff;border:1px solid rgba(255,255,255,.28);
    width:48px;height:48px;min-height:48px;border-radius:999px;font-size:22px;cursor:pointer;display:grid;place-items:center;z-index:2}
  .plb-prev{left:10px}.plb-next{right:10px}
  .plb-cap{padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
  .plb-place{font-size:19px;font-weight:700;margin:0}
  .plb-meta{margin:4px 0 0;color:#cfcdc2;font-size:14px}
  .plb-hint{margin:8px 0 0;color:#9a988d;font-size:12px}

  /* ---------- top share card ---------- */
  #card{position:fixed;z-index:600;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;max-width:470px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 10px;transition:transform .35s ease}
  /* 全行程ルート表示中：カードとシートを画面外へ畳んで地図の表示領域を最大化する。
     畳む前の状態（カードの compact／シートの collapsed）はそのまま保持され、
     OFFに戻すとクラスを外すだけで元の状態に復元される */
  body.route-view #card{transform:translateY(calc(-100% - 24px));pointer-events:none}
  body.route-view #sheet{transform:translateY(calc(100% + 24px));pointer-events:none}
  @media (prefers-reduced-motion: reduce){ #card,#sheet{transition:none} }
  /* 全行程ルート表示中の細いバナー：地図上に浮かせ、タップでOFFに戻す */
  #routeBanner{position:fixed;z-index:700;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;max-width:calc(100vw - 20px);min-height:40px;
    background:var(--ink);color:var(--panel);border:none;border-radius:999px;box-shadow:var(--shadow);
    padding:7px 8px 7px 16px;font-size:13.5px;font-weight:700;white-space:nowrap}
  #routeBanner[hidden]{display:none}
  #routeBanner .rb-off{flex:none;background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;line-height:1.3}
  #routeBanner:focus-visible{outline:2px solid var(--accent-train);outline-offset:2px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-id{flex:1 1 150px;min-width:0}
  .avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .card-name{font-size:19px;font-weight:700;line-height:1.15}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .pill{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);display:flex;align-items:center;gap:6px;min-height:32px}
  .pill .dotlive{width:8px;height:8px;border-radius:50%;background:#3da35d;flex:none}
  .pill.moving .dotlive{background:#e03131}
  .card-toggle{flex:none;min-height:36px;border:none;background:var(--chip);color:var(--chip-ink);border-radius:9px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  /* カードを畳んだ状態：見出し行だけ残し、地図の操作帯を広げる */
  #card.compact{padding-bottom:12px}
  #card.compact .card-next,#card.compact .card-note,#card.compact .tabs,#card.compact .basebar,#card.compact .album-btn{display:none}
  .card-next{margin-top:9px;font-size:14.5px;font-weight:700;line-height:1.45}
  .card-note{margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .tabs{display:flex;gap:8px;margin-top:11px}
  .tabs button{flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--panel-border);background:var(--panel);color:var(--ink);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px}
  .tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs svg{width:19px;height:19px;flex:none}

  /* ---------- bottom sheet ---------- */
  #sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--panel-border);
    border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:47dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 14px);transition:transform .35s ease}
  #sheet.collapsed{max-height:132px;overflow:hidden}
  /* スマホではシートの高さ自体を抑える（畳まない：中のボタンはシート内スクロールで届く） */
  @media (max-width:959px){ #sheet{max-height:34dvh} }
  .sheet-grip{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grip-bar{width:44px;height:5px;border-radius:3px;background:var(--track);margin:2px auto}
  #sheetToggle{min-height:36px;border:none;background:var(--chip);color:var(--chip-ink);border-radius:9px;padding:4px 12px;font-size:12.5px;font-weight:700}
  .stats{display:grid;grid-template-columns:1.45fr 1.05fr .85fr .6fr;gap:8px;margin-top:6px}
  .stat .k{font-size:11px;color:var(--muted);font-weight:700}
  .stat .v{font-size:14.5px;font-weight:700;margin-top:1px;line-height:1.3}
  .stat .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
  .progress{height:8px;border-radius:4px;background:var(--track);margin:10px 0 4px;overflow:hidden}
  .progress > div{height:100%;width:0%;background:var(--accent);border-radius:4px;transition:width .3s linear}
  .rowbtns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .btn{min-height:44px;border-radius:11px;border:1.5px solid var(--panel-border);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
  .btn.primary{background:var(--accent-walk);border-color:var(--accent-walk);color:#fff}
  .btn.big{flex:1;font-size:16.5px;min-height:54px;border-radius:13px}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn svg{width:17px;height:17px;flex:none}
  /* 「まるの現在地に戻る（ライブに戻る）」ボタン：どの場所から押しても同じ見た目で目立つように濃色にする */
  .btn.live-return{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .btn.live-return:focus-visible{outline:2px solid var(--accent-train);outline-offset:2px}
  .panel{margin-top:12px;border-top:1px solid var(--panel-border);padding-top:11px}
  .panel h3{margin:0 0 7px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  /* ストリートビュー埋め込みパネル：ボタン下に Google の埋め込みプレイヤーを
     ページ内で表示する（外部アプリへは遷移しない） */
  .sv-view{margin-top:10px}
  .sv-view-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .sv-view-title{font-size:12.5px;font-weight:700;color:var(--muted);margin-right:auto}
  .sv-view-btn{min-height:36px;font-size:12.5px;padding:5px 11px;border-radius:9px}
  .sv-frame-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--panel-border);background:#111;aspect-ratio:4/3}
  .sv-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .sv-note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:7px 0}
  #svTargetSeg{margin-top:2px}
  .sv-fallback{font-size:12px;color:var(--muted);margin:7px 0 0}
  .sv-fallback a{color:var(--accent-ink,#1a56db)}
  .svc{font-size:14px;font-weight:700;line-height:1.5}
  .fineprint{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:5px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .seg button{min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--panel-border);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:12.5px;font-weight:600;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:6px 10px;min-height:32px;display:inline-flex;align-items:center}
  .chip.done{opacity:.45}
  .chip.next{background:var(--accent);color:#fff;font-weight:700}
  .chips button.chip{border:none;cursor:pointer}
  .chips button.chip[aria-pressed="true"]{background:var(--accent-walk);color:#fff}
  .inputs{display:grid;grid-template-columns:1fr;gap:8px}
  .inputs label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
  .inputs input{width:100%;min-height:46px;border:1.5px solid var(--panel-border);border-radius:11px;background:var(--panel);color:var(--ink);font:inherit;font-size:15px;padding:8px 12px}
  .note{font-size:12.5px;line-height:1.55;margin-top:8px;color:var(--muted)}
  .note.warn{color:#b3541e;font-weight:700}
  @media (prefers-color-scheme: dark){ .note.warn{color:#f0a35e} }
  .footrow{display:flex;align-items:center;gap:10px;margin-top:13px;border-top:1px solid var(--panel-border);padding-top:10px}
  .footrow .fineprint{margin:0;flex:1}
  .linkbtn{min-height:36px;border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 6px;text-decoration:underline}

  /* ---------- map pins ---------- */
  .maru-icon{background:none;border:none}
  .maru-pin{position:relative;width:46px;height:46px}
  .maru-pin .pulse{position:absolute;inset:0;border-radius:50%;background:var(--pin);opacity:.35;animation:pulse 2.2s ease-out infinite}
  .maru-pin .core{position:absolute;inset:5px;border-radius:50%;background:var(--pin);border:3px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .maru-pin .tag{position:absolute;left:50%;top:-13px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap}
  @keyframes pulse{0%{transform:scale(.55);opacity:.45}70%{transform:scale(1.2);opacity:0}100%{transform:scale(1.2);opacity:0}}
  @media (prefers-reduced-motion: reduce){ .maru-pin .pulse{animation:none;opacity:.18} }
  .sta-icon{background:none;border:none}
  .sta{display:flex;align-items:center;transform:translate(-7px,-50%);pointer-events:none}
  .sta .d{width:9px;height:9px;flex:none;border-radius:50%;background:#fff;border:2.5px solid #6b7683;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .sta.stop .d{width:12px;height:12px;border-color:var(--accent-train);background:#fff}
  .sta .l{margin-left:4px;font-size:11px;font-weight:600;color:#26303a;background:rgba(255,255,255,.88);border-radius:7px;padding:1px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  @media (prefers-color-scheme: dark){ .sta .l{color:#e8eef3;background:rgba(20,26,33,.85)} }
  .ep-icon{background:none;border:none}
  .ep{display:flex;align-items:center;transform:translate(-7px,-50%);pointer-events:none}
  .ep .d{width:13px;height:13px;flex:none;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .ep .l{margin-left:4px;font-size:11px;font-weight:700;color:#26303a;background:rgba(255,255,255,.9);border-radius:7px;padding:1px 6px;white-space:nowrap}
  @media (prefers-color-scheme: dark){ .ep .l{color:#e8eef3;background:rgba(20,26,33,.88)} }

  /* ---------- nationwide tour panel ---------- */
  .tour-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .tour-head h3{margin:0}
  .tour-count{font-size:13px;font-weight:700;color:var(--ink)}
  .tour-count strong{font-size:19px;color:var(--accent-train)}
  .tour-bar{height:8px;border-radius:4px;background:var(--track);margin:8px 0 4px;overflow:hidden;display:flex}
  .tour-bar .done{height:100%;background:var(--accent-walk)}
  .tour-bar .active{height:100%;background:var(--accent-train);opacity:.55}
  .tour-sub{font-size:12px;color:var(--muted);line-height:1.5}
  .tour-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .tour-item{border:1px solid var(--panel-border);border-radius:12px;padding:10px 12px}
  .tour-item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tour-pref{font-size:16px;font-weight:700}
  .tour-badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;min-height:24px;display:inline-flex;align-items:center}
  .tour-badge.done{background:var(--accent-walk);color:#fff}
  .tour-badge.active{background:var(--accent-train);color:#fff}
  .tour-date{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .tour-rows{margin-top:7px;display:flex;flex-direction:column;gap:4px}
  .tour-row{display:flex;gap:8px;font-size:13px;line-height:1.5}

  /* ---------- veil / toast ---------- */

  @media (min-width:960px){
    #card{left:16px;top:16px;width:410px;right:auto}
    #sheet{left:auto;right:16px;bottom:16px;width:410px;border:1px solid var(--panel-border);border-radius:18px;max-height:calc(100dvh - 40px)}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
var SAVE_URL = "https://gist.githubusercontent.com/noyama-shiitake/d9c10da9d03a82c78fc67fdd98ea3307/raw/maru-trip-save-v2.json";
var PHOTO_BASE = "assets/photos/";
var $ = function(id){ return document.getElementById(id); };
var DATA = null, day = null, dayIdx = -1;
var stationMin = [], cumDist = [], totalDist = 0;
var isToday = false, playing = false, speed = 30, replayMin = 0, lastTick = 0;
var follow = false, interacting = false, curPos = null, curSeg = 0;
var HOME = {name:"大阪上本町", lat:34.6655536, lng:135.5207379};

var map = L.map("map", {zoomControl:true, zoomSnap:0.25, zoomDelta:0.5, wheelPxPerZoomLevel:90, inertiaDeceleration:900});
var gsiStd = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {attribution:"地理院タイル（国土地理院）", maxZoom:18});
var gsiPhoto = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {attribution:"地理院タイル（国土地理院）・全国最新写真", maxZoom:18});
gsiStd.addTo(map);
map.setView([HOME.lat, HOME.lng], 12);
var routeLine = L.polyline([], {color:"#9e2b25", weight:5, opacity:0.35}).addTo(map);
var doneLine = L.polyline([], {color:"#9e2b25", weight:5, opacity:0.95}).addTo(map);
var fullLine = null;
var staLayer = L.layerGroup().addTo(map);
var pin = L.marker([HOME.lat, HOME.lng], {icon: L.divIcon({className:"", html:'<div class="maru-pin"><div class="pulse"></div><div class="core">ま</div><div class="tag" id="pinTag">まる</div></div>', iconSize:[46,46], iconAnchor:[23,23]}), interactive:false, keyboard:false}).addTo(map);
map.on("zoomstart movestart", function(){ interacting = true; });
map.on("zoomend moveend", function(){ interacting = false; renderPin(); });

function jstNow(){ var n = new Date(); return new Date(n.getTime() + (540 + n.getTimezoneOffset())*60000); }
function todayKey(){ var j = jstNow(); return j.getFullYear()+"-"+String(j.getMonth()+1).padStart(2,"0")+"-"+String(j.getDate()).padStart(2,"0"); }
function hav(a, b){ var R=6371, r=Math.PI/180, dLa=(b[0]-a[0])*r, dLo=(b[1]-a[1])*r; var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)*Math.sin(dLo/2); return 2*R*Math.asin(Math.sqrt(s)); }
function fmtClock(min){ var t = day.startTime.split(":"); var base = (+t[0])*60 + (+t[1]) + Math.round(min); return String(Math.floor(base/60)).padStart(2,"0")+":"+String(base%60).padStart(2,"0"); }
function fmtElapsed(min){ var s = Math.max(0, Math.floor(min*60)); var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60; return h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function computeTimes(){
  var st = day.stations, n = st.length;
  stationMin = st.map(function(s){ return (s[5]==null? null : s[5]); });
  var anchors = [];
  for(var i=0;i<n;i++) if(stationMin[i]!=null) anchors.push(i);
  for(var k=0;k<anchors.length-1;k++){
    var a=anchors[k], b=anchors[k+1], segD=0, j, ds=[0];
    for(j=a;j<b;j++){ segD += hav(st[j], st[j+1]); ds.push(segD); }
    for(j=a+1;j<b;j++) stationMin[j] = stationMin[a] + (stationMin[b]-stationMin[a]) * (segD? ds[j-a]/segD : 0);
  }
  if(anchors.length && anchors[0]>0) for(var i2=0;i2<anchors[0];i2++) stationMin[i2]=stationMin[anchors[0]];
  if(anchors.length && anchors[anchors.length-1]<n-1) for(var i3=anchors[anchors.length-1]+1;i3<n;i3++) stationMin[i3]=stationMin[anchors[anchors.length-1]];
  cumDist=[0];
  for(var i4=1;i4<n;i4++) cumDist.push(cumDist[i4-1]+hav(st[i4-1], st[i4]));
  totalDist = cumDist[n-1];
}
function posAt(m){
  var st = day.stations, n = st.length;
  if(m<=0) return {lat:st[0][1], lng:st[0][2], seg:0, dist:0, dwell:false};
  if(m>=day.totalMinutes) return {lat:st[n-1][1], lng:st[n-1][2], seg:n-2, dist:totalDist, dwell:false};
  for(var i=0;i<n-1;i++){
    if(m>=stationMin[i] && m<=stationMin[i+1]){
      var a=st[i], b=st[i+1];
      if(a[1]===b[1] && a[2]===b[2]) return {lat:a[1], lng:a[2], seg:i, dist:cumDist[i], dwell:true};
      var f = (stationMin[i+1]>stationMin[i]) ? (m-stationMin[i])/(stationMin[i+1]-stationMin[i]) : 0;
      var lat=a[1]+(b[1]-a[1])*f, lng=a[2]+(b[2]-a[2])*f;
      return {lat:lat, lng:lng, seg:i, dist:cumDist[i]+hav(a,[lat,lng]), dwell:false};
    }
  }
  return {lat:st[n-1][1], lng:st[n-1][2], seg:n-2, dist:totalDist, dwell:false};
}
function elapsedNow(){
  if(!day) return 0;
  if(isToday){
    var j = jstNow(), t = day.startTime.split(":");
    var start = new Date(j.getFullYear(), j.getMonth(), j.getDate(), +t[0], +t[1], 0);
    return (j - start)/60000;
  }
  return replayMin;
}

var HOME_CARD = {sub:"位置情報を共有中 ・ 自宅（上本町付近）", pill:"自宅にいます", next:"自宅（上本町付近）にいます", note:"次の旅程が決まると、出発に合わせてここに移動が表示されます。"};
function setCard(c, moving){
  if(!c) return;
  if(c.sub) $("cardSub").textContent = c.sub;
  if(c.pill) $("cardStatus").textContent = c.pill;
  $("cardPill").classList.toggle("moving", !!moving);
  if(c.next) $("cardNext").textContent = c.next;
  if(c.note!=null) $("cardNote").textContent = c.note;
}
function fillRemain(tpl, nextMin, m){
  if(!tpl) return tpl;
  return tpl.replace("{remain}", String(Math.max(1, Math.ceil(nextMin - m))));
}
function updateCard(m, pos){
  var card = day.card || {}, st = day.stations;
  if(m < 0){
    if(!isToday){ setCard({sub: card.waiting? card.waiting.sub : "", pill:"発車待ち", next: card.waiting? card.waiting.nextReplay : "", note: card.waiting? card.waiting.note : ""}); }
    else if(card.preStart){ setCard(card.preStart); }
    else if(card.waiting){ setCard({sub:card.waiting.sub, pill:"発車待ち", next: fillRemain(card.waiting.nextLive, 0, m), note: card.waiting.note}); }
    else setCard(HOME_CARD);
    return;
  }
  if(m >= day.totalMinutes){
    if(card.end) setCard(card.end);
    else if(day.endsAtHome) setCard(HOME_CARD);
    else setCard({sub:"位置情報を共有中 ・ "+day.stay.name, pill:"到着", next: day.stay.name+"に到着 ・ 今夜はここに泊まります", note:"おつかれさま。今日の全行程が終わりました。"});
    return;
  }
  var i = pos.seg, cur = st[i], nxt = st[i+1];
  if(pos.dwell){
    var dw = (card.dwell||{})[cur[0]];
    if(dw) setCard({sub:dw.sub, pill:dw.pill, next: fillRemain(dw.next, stationMin[i+1], m), note: (day.notes||{})[String(i)] || ""});
    else setCard({sub: cur[0]+"で滞在中", pill: cur[0]+"にいます", next: cur[0]+"に到着（"+fmtClock(stationMin[i])+"）・ 次は "+nxt[0]+" "+fmtClock(stationMin[i+1]), note: (day.notes||{})[String(i)] || ""});
    return;
  }
  var leg = (card.legLabels||{})[String(i)] || card.legDefault || "移動中";
  var isWalk = leg.indexOf("徒歩")===0;
  setCard({sub: leg, pill: isWalk? "歩行中" : "電車で移動中", next: "次は "+nxt[0]+" "+fmtClock(stationMin[i+1]), note: (day.notes||{})[String(i+1)] || (day.notes||{})[String(i)] || ""}, true);
}

function renderPin(){
  if(!curPos || !day || interacting) return;
  pin.setLatLng([curPos.lat, curPos.lng]);
  var pts = [];
  for(var i=0;i<=curSeg;i++) pts.push([day.stations[i][1], day.stations[i][2]]);
  pts.push([curPos.lat, curPos.lng]);
  doneLine.setLatLngs(pts);
  var tag = $("pinTag");
  if(tag) tag.textContent = curPos.dwell? day.stations[curSeg][0] : day.stations[Math.min(curSeg+1, day.stations.length-1)][0];
  if(follow) map.setView([curPos.lat, curPos.lng], Math.max(map.getZoom(), 13), {animate:false});
}
function render(){
  if(!day) return;
  var m = elapsedNow();
  var pos = posAt(Math.max(0, Math.min(day.totalMinutes, m)));
  curPos = pos; curSeg = pos.seg;
  renderPin();
  $("statPos").textContent = pos.lat.toFixed(5)+", "+pos.lng.toFixed(5);
  $("statDist").textContent = pos.dist.toFixed(1)+"km / "+totalDist.toFixed(1)+"km";
  $("statTime").textContent = fmtElapsed(Math.max(0, Math.min(day.totalMinutes, m)));
  var pct = Math.max(0, Math.min(100, Math.round(m/day.totalMinutes*100)));
  $("statProg").textContent = pct+"%";
  $("progBar").style.width = pct+"%";
  updateCard(m, pos);
  var chips = $("stopChips");
  if(chips){
    for(var i=0;i<chips.children.length;i++){
      var si = +chips.children[i].getAttribute("data-i");
      chips.children[i].classList.toggle("done", stationMin[si]!=null && m>=stationMin[si]);
    }
  }
  var ts = $("trainStateLine");
  if(ts && !isToday) ts.textContent = playing? ("リプレイ再生中 ・ "+fmtClock(replayMin)+" / "+fmtClock(day.totalMinutes)) : ("リプレイ停止中 ・ "+fmtClock(replayMin)+" / "+fmtClock(day.totalMinutes)+" ・ 時刻表モードに戻すと当日の終わりの状態を表示します");
  var sk = $("seek");
  if(sk && document.activeElement!==sk) sk.value = Math.max(0, Math.min(day.totalMinutes, replayMin));
}

function buildTrainPanel(){
  var tp = $("trainPanel"), d = day;
  var head = (d.trainPanel && d.trainPanel.heading) ? d.trainPanel.heading :
    ((d.date===todayKey()? "今日" : "その日")+"の全区間 ・ "+d.routeNames.join(" → "));
  var h = '<div class="tour-head"><h3>'+esc(head)+'</h3><div class="tour-count">'+esc(d.title)+'</div></div>';
  if(d.trainPanel && d.trainPanel.segments && d.trainPanel.segments.length){
    d.trainPanel.segments.forEach(function(s, i){
      h += '<div class="svc"'+(i? ' style="margin-top:4px"' : '')+'>'+esc(s)+'</div>';
    });
  }
  if(d.trainPanel && d.trainPanel.fineprint) h += '<div class="fineprint">'+esc(d.trainPanel.fineprint)+'</div>';
  if(isToday){
    h += '<div style="margin-top:10px"><span class="live-note">時刻表モード ・ 実時計に同期（等速のみ）</span></div>';
    h += '<div class="note" id="trainStateLine">時刻表モード：現在時刻から位置を計算しています。今日の分は昨夜作られたセーブデータを実時計どおりに表示します（早送り・巻き戻しはできません）。</div>';
  } else {
    h += '<div class="rowbtns" style="margin-top:10px"><button type="button" class="btn accent" id="trainPlay">▶ リプレイ再生</button><button type="button" class="btn" id="trainLive">時刻表モード</button>' +
      '<span class="seg" id="speedSeg" role="group" aria-label="リプレイ速度">' +
      '<button type="button" data-mult="1">等速</button><button type="button" data-mult="30" aria-pressed="true">30倍</button><button type="button" data-mult="60">60倍</button><button type="button" data-mult="300">300倍</button></span></div>';
    h += '<input type="range" id="seek" min="0" max="'+d.totalMinutes+'" step="0.5" value="0" aria-label="リプレイ位置">';
    h += '<div class="note" id="trainStateLine"></div>';
  }
  h += '<h3 style="margin-top:12px">停車駅</h3><div class="chips" id="stopChips">';
  d.stations.forEach(function(s, i){
    if(!s[3]) return;
    h += '<button type="button" class="chip" data-i="'+i+'">'+esc(s[0])+(s[4]? ' <span>'+esc(s[4])+'</span>' : '')+'</button>';
  });
  h += '</div>';
  tp.innerHTML = h;
  if(!isToday){
    $("trainPlay").addEventListener("click", function(){
      if(replayMin>=day.totalMinutes) replayMin = 0;
      playing = !playing;
      this.textContent = playing? "⏸ 一時停止" : "▶ リプレイ再生";
      render();
    });
    $("trainLive").addEventListener("click", function(){
      playing = false; replayMin = day.totalMinutes;
      var pb = $("trainPlay"); if(pb) pb.textContent = "▶ リプレイ再生";
      render();
    });
    $("speedSeg").addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      speed = +b.getAttribute("data-mult");
      this.querySelectorAll("button").forEach(function(x){ x.removeAttribute("aria-pressed"); });
      b.setAttribute("aria-pressed","true");
    });
    $("seek").addEventListener("input", function(){ replayMin = +this.value; render(); });
  }
  $("stopChips").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    var s = day.stations[+b.getAttribute("data-i")];
    setFollow(false);
    map.setView([s[1], s[2]], 14, {animate:true});
  });
}

function buildDayPanel(){
  var dp = $("dayPanel"), p = day.panel;
  if(!p){ dp.innerHTML = ""; dp.style.display="none"; return; }
  dp.style.display = "";
  var h = '<div class="tour-head"><h3>'+esc(p.heading)+'</h3><div class="tour-count">'+esc(p.count)+'</div></div>';
  if(p.summary) h += '<div class="tour-sub">'+esc(p.summary)+'</div>';
  if(p.timeline && p.timeline.length){
    h += '<ol class="tl-list">';
    p.timeline.forEach(function(it){
      h += '<li class="tl-item"><span class="tl-time">'+esc(it.time)+'</span><span class="tl-body">'+esc(it.body)+(it.sub? '<span class="sub">'+esc(it.sub)+'</span>' : '')+'</span></li>';
    });
    h += '</ol>';
  }
  if(p.fareText) h += '<div class="tl-fare">'+esc(p.fareText)+(p.fareNote? '<div class="n">'+esc(p.fareNote)+'</div>' : '')+'</div>';
  if(p.focus && p.focus.length){
    h += '<div class="rowbtns">';
    p.focus.forEach(function(f, i){ h += '<button type="button" class="btn" data-fi="'+i+'">'+esc(f.name)+'を地図で見る</button>'; });
    h += '</div>';
  }
  dp.innerHTML = h;
  dp.querySelectorAll("button[data-fi]").forEach(function(b){
    b.addEventListener("click", function(){
      var f = day.panel.focus[+b.getAttribute("data-fi")];
      setFollow(false);
      map.setView([f.lat, f.lng], 14, {animate:true});
    });
  });
}

function buildTourPanel(){
  var q = DATA.quest, tp = $("tourPanel");
  var h = '<div class="tour-head"><h3>全国制覇の旅 ・ ご当地ちいかわ＆ご当地グルメ</h3><div class="tour-count">制覇 <strong>'+q.collected+'</strong> / '+q.totalPrefectures+' 都道府県</div></div>';
  h += '<div class="tour-bar" aria-hidden="true"><div class="done" style="width:'+Math.round(q.collected/q.totalPrefectures*100)+'%"></div><div class="active" style="width:0%"></div></div>';
  h += '<div class="tour-list">';
  q.prefectures.forEach(function(p){
    var badge = p.status==="done"? "収集済み" : (p.status==="active"? "収集中" : "予定");
    h += '<div class="tour-item"><div class="tour-item-top"><span class="tour-pref">'+p.order+'. '+esc(p.name)+'</span>' +
      '<span class="tour-badge '+esc(p.status)+'">'+badge+'</span><span class="tour-date">'+esc(p.dateLabel)+'</span></div>' +
      '<div class="tour-rows">' +
      '<div class="tour-row"><span>ちいかわ</span>'+esc(p.chiikawa)+'</div>' +
      '<div class="tour-row"><span>グルメ</span>'+esc(p.gourmet)+'</div>' +
      '<div class="tour-row"><span>移動</span>'+esc(p.move)+'</div>' +
      '</div></div>';
  });
  h += '</div><div class="tour-ledger" id="tourLedger">';
  var tf=0, tl2=0;
  DATA.days.forEach(function(d){
    if(d.status!=="completed") return;
    tf += d.account.fare; tl2 += d.account.lodging;
    h += '<div class="tour-ledger-row"><strong>'+esc(d.date)+' '+esc(d.title)+'</strong><br>運賃 '+d.account.fare.toLocaleString()+'円 ・ 宿泊費 '+d.account.lodging.toLocaleString()+'円'+(d.account.lodgingEstimate? '（目安）':'')+' ・ 合計 '+d.account.total.toLocaleString()+'円' +
      (d.accountNote? '<div class="n">'+esc(d.accountNote)+'</div>' : '')+'</div>';
  });
  h += '<div class="tour-ledger-row"><strong>累計</strong><br>運賃 '+tf.toLocaleString()+'円 ・ 宿泊費 '+tl2.toLocaleString()+'円 ・ 合計 '+(tf+tl2).toLocaleString()+'円</div>';
  h += '</div>';
  h += '<p class="fineprint">ルール：ワープなし・人が使える交通手段のみ、始発と終電を守る。鉄道は近鉄だけでなく、JR・地下鉄・他の私鉄など全ての鉄道を必要に応じて使います。終電を逃したら予算15,000円までの近くのホテルに泊まったていにします。都道府県は旅が進むたびにここへ追加されます。</p>';
  tp.innerHTML = h;
}

function buildAlbum(){
  var body = $("photoPanelBody");
  var total = 0, dayCount = 0;
  DATA.days.forEach(function(d){ if(d.photos && d.photos.length){ total += d.photos.length; dayCount++; } });
  var q = DATA.quest;
  var names = q.prefectures.filter(function(p){ return p.status==="done" || p.status==="active"; }).map(function(p){ return p.name.replace(/[県府都]$/,""); });
  var lastDate = DATA.days.filter(function(d){ return d.photos && d.photos.length; }).pop();
  var firstDate = DATA.days.filter(function(d){ return d.photos && d.photos.length; })[0];
  var h = '<div class="pp-inner"><p class="pp-lead">まるの<strong>全国ご当地ちいかわ収集の旅</strong>で撮った自撮り集です。駅に着いたとき、ホテルの前、楽しかった場所で撮った写真を、日付ごとにまとめています。</p>';
  h += '<div class="pp-stats" aria-label="アルバムの概要"><span class="pp-stat">📸 '+total+'枚 <span>の写真</span></span><span class="pp-stat">🗓️ '+dayCount+'日間 <span>'+(firstDate? firstDate.date.replace(/-/g,"年").replace(/年(\d+)月/,"年$1月") : '')+'〜'+(lastDate? lastDate.date.slice(5).replace("-","月")+"日" : '')+'</span></span><span class="pp-stat">🗾 '+q.collected+' / '+q.totalPrefectures+'県 <span>到達</span></span></div>';
  h += '<div class="pp-progress" aria-label="収集の進み具合"><div class="pp-progress-head"><b>ご当地収集の旅　'+q.collected+' / '+q.totalPrefectures+'県</b> <small>ご当地ちいかわ入手 '+q.goodsCollected+'県 ＋ グルメのみ '+q.gourmetOnly+'県</small></div>' +
    '<div class="pp-bar" role="progressbar" aria-valuenow="'+q.collected+'" aria-valuemin="0" aria-valuemax="'+q.totalPrefectures+'"><i style="width:'+Math.round(q.collected/q.totalPrefectures*100)+'%"></i></div>' +
    '<p class="pp-pref-list">'+names.join(" ・ ")+'</p></div>';
  var flat = [];
  DATA.days.forEach(function(d){
    if(!d.photos || !d.photos.length) return;
    h += '<div class="pp-day"><div class="pp-day-head"><span>'+esc(d.date)+' '+esc(d.title)+'</span><span class="pp-day-count">'+d.photos.length+'枚</span></div><div class="pp-grid">';
    d.photos.forEach(function(p){
      var idx = flat.length; flat.push({file:p.file, place:p.place, prefecture:p.prefecture, day:d.title});
      h += '<button type="button" class="pp-card" data-lb="'+idx+'"><img loading="lazy" src="'+PHOTO_BASE+p.file+'" alt="'+esc(p.place)+'"><span class="pp-card-body"><span class="pp-card-place">'+esc(p.place)+'</span><span class="pp-card-pref">'+esc(p.prefecture)+'</span></span></button>';
    });
    h += '</div></div>';
  });
  h += '</div>';
  body.innerHTML = h;
  window._flatPhotos = flat;
  body.querySelectorAll("button[data-lb]").forEach(function(b){
    b.addEventListener("click", function(){ openLb(+b.getAttribute("data-lb")); });
  });
}
var lbIdx = 0;
function openLb(i){
  var f = window._flatPhotos; if(!f || !f.length) return;
  lbIdx = (i+f.length)%f.length;
  $("lbImg").src = PHOTO_BASE+f[lbIdx].file;
  $("lbCap").textContent = f[lbIdx].place+"（"+f[lbIdx].prefecture+"）・ "+f[lbIdx].day;
  $("lbCount").textContent = (lbIdx+1)+" / "+f.length;
  $("lightbox").hidden = false;
}
$("lbClose").addEventListener("click", function(){ $("lightbox").hidden = true; });
$("lbPrev").addEventListener("click", function(){ openLb(lbIdx-1); });
$("lbNext").addEventListener("click", function(){ openLb(lbIdx+1); });
$("albumOpenBtn").addEventListener("click", function(){ $("photoPanel").hidden = false; });
$("photoPanelClose").addEventListener("click", function(){ $("photoPanel").hidden = true; });

function selectDay(dateStr, keepReplay){
  dayIdx = -1;
  DATA.days.forEach(function(d, i){ if(d.date===dateStr) dayIdx = i; });
  if(dayIdx<0) dayIdx = 0;
  day = DATA.days[dayIdx];
  isToday = (day.date === todayKey());
  playing = false; if(!keepReplay) replayMin = 0;
  computeTimes();
  routeLine.setLatLngs(day.stations.map(function(s){ return [s[1], s[2]]; }));
  staLayer.clearLayers();
  var seen = {};
  day.stations.forEach(function(s){
    if(!s[3]) return;
    var key = s[0]+"@"+s[1]+","+s[2];
    if(seen[key]) return; seen[key] = 1;
    var icon = L.divIcon({className:"sta-icon", html:'<div class="sta stop"><span class="d"></span><span class="lb">'+esc(s[0])+'</span></div>', iconSize:[12,12], iconAnchor:[6,6]});
    L.marker([s[1], s[2]], {icon:icon, interactive:false, keyboard:false}).addTo(staLayer);
  });
  buildTrainPanel();
  buildDayPanel();
  render();
  map.fitBounds(routeLine.getBounds(), {padding:[30,30]});
  setTimeout(function(){ map.invalidateSize(); if(day) map.fitBounds(routeLine.getBounds(), {padding:[30,30]}); render(); }, 350);
}

function setFollow(v){
  follow = v;
  $("followBtn").textContent = v? "カメラ追従：オン" : "カメラ追従：オフ";
  $("followBtn").setAttribute("aria-pressed", v? "true":"false");
}
$("followBtn").addEventListener("click", function(){ setFollow(!follow); if(follow) renderPin(); });
$("fitBtn").addEventListener("click", function(){ setFollow(false); if(day) map.fitBounds(routeLine.getBounds(), {padding:[30,30]}); });
$("osakaBtn").addEventListener("click", function(){ setFollow(false); map.setView([HOME.lat, HOME.lng], 14, {animate:true}); });
$("liveReturnBtn").addEventListener("click", function(){
  var t = todayKey(), has = DATA.days.some(function(d){ return d.date===t; });
  var target = has? t : DATA.days[DATA.days.length-1].date;
  $("daysel").value = target;
  selectDay(target);
  setFollow(true);
});
$("routeBtn").addEventListener("click", function(){
  var pts = [];
  DATA.days.forEach(function(d){ d.stations.forEach(function(s){ pts.push([s[1], s[2]]); }); });
  if(fullLine) map.removeLayer(fullLine);
  fullLine = L.polyline(pts, {color:"#9e2b25", weight:5, opacity:0.9}).addTo(map);
  var last = DATA.days[DATA.days.length-1];
  var lp = last.stations[last.stations.length-1][0];
  $("routeBannerText").textContent = "全行程ルートを表示中（大阪上本町 → "+lp+"）";
  $("routeBanner").hidden = false;
  document.body.classList.add("route-view");
  map.fitBounds(fullLine.getBounds(), {padding:[30,30]});
});
$("routeExit").addEventListener("click", function(){
  if(fullLine){ map.removeLayer(fullLine); fullLine = null; }
  $("routeBanner").hidden = true;
  document.body.classList.remove("route-view");
  if(day) map.fitBounds(routeLine.getBounds(), {padding:[30,30]});
});
$("baseStd").addEventListener("click", function(){
  map.removeLayer(gsiPhoto); gsiStd.addTo(map);
  this.setAttribute("aria-pressed","true"); $("basePhoto").setAttribute("aria-pressed","false");
});
$("basePhoto").addEventListener("click", function(){
  map.removeLayer(gsiStd); gsiPhoto.addTo(map);
  this.setAttribute("aria-pressed","true"); $("baseStd").setAttribute("aria-pressed","false");
});
$("cardToggle").addEventListener("click", function(){
  var b = $("cardBody"), open = b.style.display!=="none";
  b.style.display = open? "none":"";
  document.getElementById("card").classList.toggle("compact", open);
  this.textContent = open? "カードを開く" : "カードを縮める";
  this.setAttribute("aria-expanded", open? "false":"true");
});
$("sheetToggle").addEventListener("click", function(){
  var b = $("sheetBody"), open = b.style.display!=="none";
  b.style.display = open? "none":"";
  document.getElementById("sheet").classList.toggle("collapsed", open);
  this.textContent = open? "シートを開く" : "シートを閉じる";
  this.setAttribute("aria-expanded", open? "false":"true");
});
$("reloadBtn").addEventListener("click", function(){ loadData(true); });

/* Street View: in-page panel, position snapped to the road via OSRM */
var svMode = "here";
function svEmbed(lat, lng){ return "https://www.google.com/maps?q=&layer=c&cbll="+lat+","+lng+"&cbp=11,0,0,0,0&output=svembed"; }
function nearestOnRoute(pts, p){
  var best=null, bd=1e9;
  for(var i=0;i<pts.length;i++){ var d=hav(pts[i],[p.lat,p.lng]); if(d<bd){ bd=d; best=pts[i]; } }
  return best;
}
function openSv(){ if(!day || !curPos) return; $("svPanel").hidden = false; updateSv(); }
function updateSv(){
  var st = day.stations, target, cap;
  if(svMode==="here"){ target = {lat:curPos.lat, lng:curPos.lng}; cap = "現在のまるの位置"; }
  else if(svMode==="prev"){ var s = st[Math.max(0, curSeg)]; target = {lat:s[1], lng:s[2]}; cap = "直前の地点："+s[0]; }
  else { var s2 = st[Math.min(st.length-1, curSeg+1)]; target = {lat:s2[1], lng:s2[2]}; cap = "次の地点："+s2[0]; }
  $("svCap").textContent = cap+"を表示しています（道路に合わせて表示）";
  $("svFallback").href = "https://www.google.com/maps?q=&layer=c&cbll="+target.lat+","+target.lng;
  var a = st[Math.max(0, curSeg)], b = st[Math.min(st.length-1, curSeg+1)];
  var url = "https://router.project-osrm.org/route/v1/driving/"+a[2]+","+a[1]+";"+b[2]+","+b[1]+"?overview=full&geometries=geojson";
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var coords = (j.routes && j.routes[0])? j.routes[0].geometry.coordinates.map(function(c){ return [c[1], c[0]]; }) : [[a[1],a[2]],[b[1],b[2]]];
    var snap = nearestOnRoute(coords, target) || [target.lat, target.lng];
    $("svFrame").src = svEmbed(snap[0], snap[1]);
  }).catch(function(){ $("svFrame").src = svEmbed(target.lat, target.lng); });
}
$("svBtn").addEventListener("click", openSv);
$("svCloseBtn").addEventListener("click", function(){ $("svPanel").hidden = true; $("svFrame").src = "about:blank"; });
$("svRefreshBtn").addEventListener("click", updateSv);
$("svTargetSeg").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  svMode = b.id==="svHereBtn"? "here" : (b.id==="svPrevBtn"? "prev" : "next");
  this.querySelectorAll("button").forEach(function(x){ x.removeAttribute("aria-pressed"); });
  b.setAttribute("aria-pressed","true");
  updateSv();
});

function loadData(keep){
  fetch(SAVE_URL, {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
    DATA = j;
    if(j.home) HOME = j.home;
    var sel = $("daysel");
    var cur = keep? sel.value : null;
    sel.innerHTML = "";
    j.days.forEach(function(d){
      var o = document.createElement("option");
      o.value = d.date;
      o.textContent = d.date.replace(/-/g,"/")+" "+d.title+(d.status==="planned"? "（予定）":"");
      sel.appendChild(o);
    });
    var t = todayKey();
    var def = j.days.some(function(d){ return d.date===t; })? t : j.days[j.days.length-1].date;
    sel.value = (cur && j.days.some(function(d){ return d.date===cur; }))? cur : def;
    buildTourPanel();
    buildAlbum();
    selectDay(sel.value, keep);
  }).catch(function(e){
    $("cardNext").textContent = "セーブデータを読み込めませんでした";
    $("cardNote").textContent = "通信状態を確認して、リロードをお試しください。";
  });
}
$("daysel").addEventListener("change", function(){ selectDay(this.value); });

setInterval(function(){
  var now = performance.now();
  if(playing && day && !isToday){
    var dt = (now - lastTick)/1000;
    replayMin = Math.min(day.totalMinutes, replayMin + dt*speed/60);
    if(replayMin>=day.totalMinutes){ playing = false; var pb = $("trainPlay"); if(pb) pb.textContent = "▶ リプレイ再生"; }
  }
  lastTick = now;
  render();
}, 1000);
loadData(false);
</script>
