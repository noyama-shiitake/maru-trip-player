<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まるの旅</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    color-scheme: light dark;
    --panel:#ffffff; --panel-border:#dde3e8; --ink:#1d2530; --muted:#5d6874;
    --accent-train:#9e2b25; --accent-walk:#17705a; --accent:var(--accent-train);
    --chip:#eef1f4; --chip-ink:#3c4652; --track:#e3e8ec;
    --btn-ink:#ffffff; --shadow:0 6px 24px rgba(20,30,40,.18);
    --pin:var(--accent-train);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --panel:#171d24; --panel-border:#2c353f; --ink:#edf2f6; --muted:#9fadb9;
      --chip:#232c35; --chip-ink:#c6d2dc; --track:#2a333d;
      --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;color:var(--ink);background:#cfd8dc}
  button{font:inherit;cursor:pointer}
  #map{position:fixed;inset:0;z-index:0;background:#dfe7ea}
  .leaflet-container{font-family:inherit}
  .leaflet-control-attribution{font-size:10.5px;line-height:1.4}
  /* ---------- base layer switcher ---------- */
  .basebar{display:flex;align-items:center;gap:9px;margin-top:10px}
  .basebar-label{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
  .base-switch{display:flex;gap:3px;flex:1;background:var(--chip);border:1px solid var(--panel-border);border-radius:999px;padding:3px}
  .base-switch button{flex:1;border:none;background:transparent;color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.2;padding:8px 13px;border-radius:999px;min-height:38px;white-space:nowrap}
  .base-switch button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
  /* ---------- top share card ---------- */
  #card{position:fixed;z-index:600;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;max-width:470px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 10px;transition:transform .35s ease}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-id{flex:1 1 130px;min-width:0}
  .avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .card-name{font-size:19px;font-weight:700;line-height:1.15}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .pill{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);display:flex;align-items:center;gap:6px;min-height:32px}
  .pill .dotlive{width:8px;height:8px;border-radius:50%;background:#3da35d;flex:none}
  .pill.moving .dotlive{background:#e03131}
  .card-toggle{flex:none;min-height:36px;border:none;background:var(--chip);color:var(--chip-ink);border-radius:9px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  #card.compact{padding-bottom:12px}
  #card.compact .card-next,#card.compact .card-note,#card.compact .daypick,#card.compact .basebar,#card.compact .album-btn{display:none}
  .card-next{margin-top:9px;font-size:14.5px;font-weight:700;line-height:1.45}
  .card-note{margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .daypick{margin-top:11px}
  .daypick select{width:100%;min-height:46px;border:1.5px solid var(--panel-border);border-radius:11px;background:var(--panel);color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:8px 12px}
  .album-btn{display:flex;width:100%;margin-top:9px;justify-content:center;min-height:48px;font-size:15px}
  body.route-view #card{transform:translateY(calc(-100% - 24px));pointer-events:none}
  body.route-view #sheet{transform:translateY(calc(100% + 24px));pointer-events:none}
  #routeBanner{position:fixed;z-index:700;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;max-width:calc(100vw - 20px);min-height:40px;
    background:var(--ink);color:var(--panel);border:none;border-radius:999px;box-shadow:var(--shadow);
    padding:7px 8px 7px 16px;font-size:13.5px;font-weight:700;white-space:nowrap}
  #routeBanner[hidden]{display:none}
  #routeBanner .rb-off{flex:none;background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;line-height:1.3}
  /* ---------- album panel ---------- */
  #albumPanel{position:fixed;inset:0;z-index:850;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;overscroll-behavior:contain}
  #albumPanel[hidden]{display:none}
  .pp-head{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--panel-border);background:var(--panel)}
  .pp-title{flex:1;font-size:19px;font-weight:700;line-height:1.25;margin:0}
  .pp-close{flex:none;min-height:44px;border:1.5px solid var(--panel-border);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
  .pp-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
  .pp-inner{max-width:860px;margin:0 auto}
  .pp-lead{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
  .pp-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pp-stat{background:var(--chip);border:1px solid var(--panel-border);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
  .pp-stat span{color:var(--muted);font-weight:600;font-size:12.5px}
  .pp-progress{margin-top:12px;border:1px solid var(--panel-border);border-radius:12px;padding:11px 13px}
  .pp-progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .pp-progress-head b{font-size:14px}
  .pp-progress-head small{color:var(--muted);font-size:12.5px}
  .pp-bar{height:9px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:8px}
  .pp-bar i{display:block;height:100%;background:var(--accent-walk);border-radius:999px}
  .pp-day{margin-top:26px}
  .pp-day-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .pp-day-head h3{font-size:17.5px;margin:0;font-weight:700}
  .pp-day-count{font-size:12px;color:#fff;background:var(--accent-walk);border-radius:999px;padding:3px 10px;font-weight:700}
  .pp-day-sub{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.6}
  .pp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:640px){ .pp-grid{grid-template-columns:repeat(3,1fr);gap:12px} }
  @media (min-width:900px){ .pp-grid{grid-template-columns:repeat(4,1fr)} }
  .pp-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;overflow:hidden;text-align:left;padding:0;cursor:pointer;font:inherit;color:inherit;display:block;width:100%}
  .pp-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--track)}
  .pp-card-body{display:block;padding:8px 10px 10px}
  .pp-card-place{display:block;font-weight:700;font-size:14px;line-height:1.35}
  .pp-card-pref{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  /* ---------- photo lightbox ---------- */
  #photoLb{position:fixed;inset:0;z-index:880;background:rgba(16,17,15,.95);color:#f5f4ee;display:flex;flex-direction:column}
  #photoLb[hidden]{display:none}
  .plb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
  .plb-counter{font-size:13px;color:#cfcdc2;font-weight:700;letter-spacing:.04em}
  .plb-close{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;min-width:44px;min-height:44px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .plb-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 12px;position:relative}
  .plb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .plb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(20,20,18,.55);color:#fff;border:1px solid rgba(255,255,255,.28);width:48px;height:48px;min-height:48px;border-radius:999px;font-size:22px;cursor:pointer;display:grid;place-items:center;z-index:2}
  .plb-prev{left:10px}.plb-next{right:10px}
  .plb-cap{padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
  .plb-place{font-size:19px;font-weight:700;margin:0}
  .plb-meta{margin:4px 0 0;color:#cfcdc2;font-size:14px}
  /* ---------- buttons ---------- */
  .btn{min-height:44px;border-radius:11px;border:1.5px solid var(--panel-border);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
  .btn.primary{background:var(--accent-walk);border-color:var(--accent-walk);color:#fff}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.live-return{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .btn svg{width:17px;height:17px;flex:none}
  .rowbtns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  /* ---------- bottom sheet ---------- */
  #sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--panel-border);
    border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:47dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 14px);transition:transform .35s ease}
  #sheet.collapsed{max-height:132px;overflow:hidden}
  @media (max-width:959px){ #sheet{max-height:34dvh} }
  .sheet-grip{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grip-bar{width:44px;height:5px;border-radius:3px;background:var(--track);margin:2px auto}
  #sheetToggle{min-height:36px;border:none;background:var(--chip);color:var(--chip-ink);border-radius:9px;padding:4px 12px;font-size:12.5px;font-weight:700}
  .stats{display:grid;grid-template-columns:1.45fr 1.05fr .85fr .6fr;gap:8px;margin-top:6px}
  .stat .k{font-size:11px;color:var(--muted);font-weight:700}
  .stat .v{font-size:14.5px;font-weight:700;margin-top:1px;line-height:1.3}
  .stat .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
  .progress{height:8px;border-radius:4px;background:var(--track);margin:10px 0 4px;overflow:hidden}
  .progress > div{height:100%;width:0%;background:var(--accent);border-radius:4px;transition:width .3s linear}
  .panel{margin-top:12px;border-top:1px solid var(--panel-border);padding-top:11px}
  .panel h3{margin:0 0 7px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .note{font-size:12.5px;line-height:1.55;margin-top:8px;color:var(--muted)}
  .note.warn{color:#b3541e;font-weight:700}
  @media (prefers-color-scheme: dark){ .note.warn{color:#f0a35e} }
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .seg button{min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--panel-border);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:12.5px;font-weight:600;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:6px 10px;min-height:32px;display:inline-flex;align-items:center}
  .chip.done{opacity:.45}
  .chip.next{background:var(--accent);color:#fff;font-weight:700}
  button.chip{border:none;cursor:pointer;font:inherit}
  #seek{width:100%;accent-color:var(--accent-train);height:28px}
  .tour-ledger{margin-top:10px;background:var(--chip);border-radius:12px;padding:9px 12px}
  .tour-ledger .t{font-size:12px;font-weight:700;color:var(--muted)}
  .tour-ledger .v{font-size:14px;font-weight:700;margin-top:2px;line-height:1.5}
  .tour-ledger .n{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .photos{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  .photos img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:1px solid var(--panel-border);cursor:pointer;flex:0 0 auto;background:var(--track)}
  /* ---------- map pins ---------- */
  .maru-icon{background:none;border:none}
  .maru-pin{position:relative;width:46px;height:46px}
  .maru-pin .pulse{position:absolute;inset:0;border-radius:50%;background:var(--pin);opacity:.35;animation:pulse 2.2s ease-out infinite}
  .maru-pin .core{position:absolute;inset:5px;border-radius:50%;background:var(--pin);border:3px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .maru-pin .tag{position:absolute;left:50%;top:-13px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap}
  @keyframes pulse{0%{transform:scale(.55);opacity:.45}70%{transform:scale(1.2);opacity:0}100%{transform:scale(1.2);opacity:0}}
  @media (prefers-reduced-motion: reduce){ .maru-pin .pulse{animation:none;opacity:.18} }
  .sta-icon{background:none;border:none}
  .sta{display:flex;align-items:center;transform:translate(-7px,-50%);pointer-events:none}
  .sta .d{width:9px;height:9px;flex:none;border-radius:50%;background:#fff;border:2.5px solid #6b7683;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .sta.stop .d{width:12px;height:12px;border-color:var(--accent-train);background:#fff}
  .sta .l{margin-left:4px;font-size:11px;font-weight:600;color:#26303a;background:rgba(255,255,255,.88);border-radius:7px;padding:1px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  @media (prefers-color-scheme: dark){ .sta .l{color:#e8eef3;background:rgba(20,26,33,.85)} }
  /* ---------- photo overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:880;background:rgba(16,17,15,.95);display:none;align-items:center;justify-content:center;flex-direction:column}
  #overlay img{max-width:94vw;max-height:82vh;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #overlay .cap{color:#f5f4ee;margin-top:12px;font-size:15px;font-weight:700}
  #overlay .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;min-width:44px;min-height:44px;font-size:16px;cursor:pointer}
  @media (min-width:960px){
    #card{left:16px;top:16px;width:410px;right:auto}
    #sheet{left:auto;right:16px;bottom:16px;width:410px;border:1px solid var(--panel-border);border-radius:18px;max-height:calc(100dvh - 40px)}
    #sheet.collapsed{max-height:150px}
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="まるの旅マップ"></div>

<!-- ======== share card ======== -->
<header id="card">
  <div class="card-head">
    <div class="avatar" aria-hidden="true">ま</div>
    <div class="card-id">
      <div class="card-name">まるの旅</div>
      <div class="card-sub" id="quest">読み込み中…</div>
    </div>
    <div class="pill" id="cardPill"><span class="dotlive"></span><span id="cardStatus">読み込み中</span></div>
    <button type="button" class="card-toggle" id="reload">🔄 リロード</button>
    <button type="button" class="card-toggle" id="cardToggle" aria-expanded="true">カードを縮める</button>
  </div>
  <div class="card-next" id="cardNext">地図を準備しています…</div>
  <div class="card-note" id="cardNote"></div>
  <div class="daypick">
    <select id="daysel" aria-label="日を選ぶ"></select>
  </div>
  <div class="basebar">
    <span class="basebar-label" id="baseBarLabel">地図</span>
    <div class="base-switch" role="group" aria-labelledby="baseBarLabel" aria-label="地図の種類">
      <button type="button" id="tile-std" aria-pressed="true">標準地図</button>
      <button type="button" id="tile-photo" aria-pressed="false">航空写真</button>
    </div>
  </div>
  <button type="button" class="btn album-btn" id="albumOpenBtn">📷 まるの旅の写真</button>
</header>

<!-- ======== bottom sheet ======== -->
<section id="sheet" aria-label="旅の表示と操作">
  <div class="grip-bar" aria-hidden="true"></div>
  <div class="sheet-grip">
    <strong style="font-size:13.5px" id="sheetTitle">読み込み中…</strong>
    <button id="sheetToggle" aria-expanded="true">シートを閉じる</button>
  </div>
  <div id="dayinfo" hidden>
    <div class="stats">
      <div class="stat"><div class="k">現在地（緯度・経度）</div><div class="v mono" id="statPos">—</div></div>
      <div class="stat"><div class="k">進んだ距離</div><div class="v" id="statDist">—</div></div>
      <div class="stat"><div class="k">経過時間</div><div class="v" id="statTime">—</div></div>
      <div class="stat"><div class="k">進捗</div><div class="v" id="statProg">—</div></div>
    </div>
    <div class="progress" aria-hidden="true"><div id="progbar"></div></div>
    <div class="rowbtns">
      <button type="button" class="btn" id="follow" aria-pressed="false">カメラ追従：オフ</button>
      <button type="button" class="btn live-return" id="liveReturnBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        まるの現在地に戻る
      </button>
      <button type="button" class="btn" id="fitBtn">全体を表示</button>
      <button type="button" class="btn" id="fullRouteBtn" aria-pressed="false">全行程ルート</button>
    </div>
    <p class="note warn" id="liveNote" hidden>🔴 今日の旅：いまの時刻に合わせて表示しています（当日は早送りできません）</p>

    <div class="panel" id="playPanel">
      <h3>再生</h3>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="シーク">
      <div class="chips" style="margin-top:2px">
        <button type="button" class="btn accent" id="play">▶ 再生</button>
      </div>
      <div class="seg" id="speedSeg" role="group" aria-label="再生速度">
        <button type="button" data-mult="1" aria-pressed="false">等速</button>
        <button type="button" data-mult="60" aria-pressed="false">60倍</button>
        <button type="button" data-mult="300" aria-pressed="true">300倍</button>
        <button type="button" data-mult="900" aria-pressed="false">900倍</button>
      </div>
      <p class="note" id="clockLine">時刻 —</p>
    </div>

    <div class="panel">
      <h3 id="routeHead">行程</h3>
      <div class="chips" id="dchips"></div>
      <div class="tour-ledger" id="ledger" hidden>
        <div class="t">収支（運賃・宿泊費）</div>
        <div class="v" id="ledgerV"></div>
        <div class="n" id="ledgerN"></div>
      </div>
    </div>

    <div class="panel">
      <h3>停車地点</h3>
      <div class="chips" id="stopChips"></div>
    </div>

    <div class="panel" id="photoPanel" hidden>
      <h3>この日の写真</h3>
      <div class="photos" id="photos"></div>
    </div>
  </div>
</section>

<button type="button" id="routeBanner" hidden>全行程ルートを表示中（大阪上本町 → 現在地）<span class="rb-off">✕ 終了</span></button>

<div id="albumPanel" hidden>
  <div class="pp-head">
    <p class="pp-title">まるの旅の写真</p>
    <button type="button" class="pp-close" id="albumCloseBtn">閉じる</button>
  </div>
  <div class="pp-body"><div class="pp-inner" id="albumBody"></div></div>
</div>

<div id="photoLb" hidden>
  <div class="plb-top">
    <span class="plb-counter" id="lbCounter"></span>
    <button type="button" class="plb-close" id="lbClose">閉じる</button>
  </div>
  <div class="plb-stage">
    <button type="button" class="plb-nav plb-prev" id="lbPrev">‹</button>
    <img id="lbImg" alt="">
    <button type="button" class="plb-nav plb-next" id="lbNext">›</button>
  </div>
  <div class="plb-cap">
    <p class="plb-place" id="lbPlace"></p>
    <p class="plb-meta" id="lbMeta"></p>
  </div>
</div>

<div id="overlay">
  <button class="close" id="ovclose">✕</button>
  <img id="ovimg" alt="">
  <div class="cap" id="ovcap"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SAVE_URL = "https://gist.githubusercontent.com/noyama-shiitake/66671c83ac1baf15406187c990cc1917/raw/maru-trip-save.json";
const PHOTO_BASE = "photos/";
const $ = id => document.getElementById(id);

const map = L.map("map", {zoomControl: false}).setView([34.68, 135.52], 7);
const stdLayer = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
  {attribution: "地図：地理院タイル（国土地理院）", maxZoom: 18}).addTo(map);
const photoLayer = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",
  {attribution: "航空写真：地理院タイル（全国最新写真・国土地理院）", maxZoom: 18});
function setTile(which){
  if (which === "photo"){ map.removeLayer(stdLayer); photoLayer.addTo(map); }
  else { map.removeLayer(photoLayer); stdLayer.addTo(map); }
  $("tile-std").setAttribute("aria-pressed", which === "std" ? "true" : "false");
  $("tile-photo").setAttribute("aria-pressed", which === "photo" ? "true" : "false");
}
$("tile-std").onclick = () => setTile("std");
$("tile-photo").onclick = () => setTile("photo");

let SAVE = null, day = null, stops = [], pin = null, pinTag = null, routeLine = null, doneLine = null, markers = [];
let elapsed = 0, playing = false, raf = null, lastTs = null, speedMult = 300;
let liveMode = false, liveTimer = null, following = false;
let segLens = [], totalDist = 0, chipEls = [];

function maruIconHtml(tag){
  return '<div class="maru-pin"><span class="pulse"></span><span class="tag">' + tag + '</span><span class="core">ま</span></div>';
}
function staIcon(s){
  const label = (s.time ? s.time + " " : "") + s.name;
  return L.divIcon({className: "sta-icon", html: '<div class="sta' + (s.stop ? " stop" : "") + '"><span class="d"></span><span class="l">' + label + "</span></div>", iconSize: [12, 12], iconAnchor: [6, 6]});
}
function todayStr(){
  const n = new Date();
  const p = x => String(x).padStart(2, "0");
  return n.getFullYear() + "-" + p(n.getMonth() + 1) + "-" + p(n.getDate());
}
function liveElapsed(d){
  const [h, m] = d.startTime.split(":").map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  const mins = (Date.now() - start.getTime()) / 60000;
  return Math.max(0, Math.min(d.totalMinutes, mins));
}
function hav(a, b){
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad) * Math.cos(b.lat*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function prepare(d){
  const st = d.stops.map(s => ({...s}));
  st.forEach(s => { if (s.atMin != null) s._t = s.atMin; });
  for (let i = 0; i < st.length; i++){
    if (st[i]._t != null) continue;
    let prev = null, next = null;
    for (let j = i - 1; j >= 0; j--) if (st[j]._t != null){ prev = st[j]; break; }
    for (let j = i + 1; j < st.length; j++) if (st[j]._t != null){ next = st[j]; break; }
    if (prev && next){
      const total = hav(prev, next);
      st[i]._t = total > 0 ? prev._t + (next._t - prev._t) * (hav(prev, st[i]) / total) : prev._t;
    } else if (prev) st[i]._t = prev._t;
    else if (next) st[i]._t = next._t;
    else st[i]._t = 0;
  }
  segLens = []; totalDist = 0;
  for (let i = 1; i < st.length; i++){ const L2 = hav(st[i-1], st[i]); segLens.push(L2); totalDist += L2; }
  return st;
}
function posAt(st, t){
  if (t <= st[0]._t) return [st[0].lat, st[0].lng];
  for (let i = 1; i < st.length; i++){
    if (t <= st[i]._t){
      const a = st[i-1], b = st[i], span = b._t - a._t;
      const f = span > 0 ? (t - a._t) / span : 0;
      return [a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f];
    }
  }
  const last = st[st.length - 1];
  return [last.lat, last.lng];
}
function distAt(st, t){
  let d = 0;
  for (let i = 1; i < st.length; i++){
    if (t >= st[i]._t) d += segLens[i-1];
    else {
      const span = st[i]._t - st[i-1]._t;
      if (span > 0) d += segLens[i-1] * ((t - st[i-1]._t) / span);
      break;
    }
  }
  return d;
}
function fmtTime(mins){
  const [h, m] = day.startTime.split(":").map(Number);
  const total = h * 60 + m + Math.floor(mins);
  return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
}
function fmtElapsed(mins){
  const h = Math.floor(mins / 60), m = Math.floor(mins % 60);
  return h > 0 ? h + ":" + String(m).padStart(2, "0") : "0:" + String(m).padStart(2, "0");
}
function currentAndNext(st, t){
  let cur = st[0], next = null;
  for (let i = 0; i < st.length; i++){
    if (st[i]._t <= t + 0.001 && st[i].stop) cur = st[i];
    if (st[i]._t > t + 0.001 && st[i].stop){ next = st[i]; break; }
  }
  return {cur, next};
}
function render(){
  if (!day) return;
  const st = stops;
  const p = posAt(st, elapsed);
  pin.setLatLng(p);
  if (following) map.setView(p, map.getZoom(), {animate: false});
  const {cur, next} = currentAndNext(st, elapsed);
  if (pinTag !== cur.name){
    pinTag = cur.name;
    pin.setIcon(L.divIcon({className: "maru-icon", html: maruIconHtml(cur.name), iconSize: [46, 46], iconAnchor: [23, 23]}));
  }
  const donePts = [];
  for (let i = 0; i < st.length; i++){
    if (st[i]._t <= elapsed) donePts.push([st[i].lat, st[i].lng]);
    else break;
  }
  donePts.push(p);
  if (doneLine) doneLine.setLatLngs(donePts);
  $("statPos").textContent = p[0].toFixed(5) + ", " + p[1].toFixed(5);
  $("statDist").textContent = (distAt(st, elapsed) / 1000).toFixed(1) + "km";
  $("statTime").textContent = fmtElapsed(elapsed);
  const pct = day.totalMinutes > 0 ? Math.round(elapsed / day.totalMinutes * 100) : 0;
  $("statProg").textContent = pct + "%";
  $("progbar").style.width = pct + "%";
  $("clockLine").textContent = "時刻 " + fmtTime(elapsed) + (liveMode ? "（いまの時刻）" : "");
  if (!liveMode) $("seek").value = Math.round(elapsed / day.totalMinutes * 1000);
  $("cardNext").textContent = next ? "つぎ： " + next.name + (next.time ? " " + next.time : "") : "最終地点： " + cur.name;
  $("cardNote").textContent = cur.note || "";
  $("cardPill").classList.toggle("moving", !!next && elapsed > st[0]._t);
  chipEls.forEach(c => {
    c.el.classList.toggle("done", c.stop._t < elapsed - 0.001);
    c.el.classList.toggle("next", c.stop === cur);
  });
}
function tick(ts){
  if (!playing) return;
  if (lastTs == null) lastTs = ts;
  const dt = (ts - lastTs) / 1000; lastTs = ts;
  elapsed += dt * speedMult / 60;
  if (elapsed >= day.totalMinutes){ elapsed = day.totalMinutes; pause(); }
  render();
  if (playing) raf = requestAnimationFrame(tick);
}
function play(){ if (liveMode) return; playing = true; lastTs = null; $("play").textContent = "⏸ 一時停止"; raf = requestAnimationFrame(tick); }
function pause(){ playing = false; $("play").textContent = "▶ 再生"; if (raf) cancelAnimationFrame(raf); }
$("play").onclick = () => playing ? pause() : play();
$("seek").oninput = e => { if (liveMode) return; pause(); elapsed = Number(e.target.value) / 1000 * day.totalMinutes; render(); };
$("speedSeg").querySelectorAll("button").forEach(b => {
  b.onclick = () => {
    speedMult = Number(b.dataset.mult);
    $("speedSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  };
});

function selectDay(idx, fit = true){
  if (routeView) exitRouteView(false);
  curIdx = idx;
  pause();
  if (liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  day = SAVE.days[idx];
  stops = prepare(day);
  elapsed = 0;
  $("daysel").value = String(idx);
  $("dayinfo").hidden = false;
  $("sheetTitle").textContent = day.date + "　" + day.title + (day.status === "planned" ? "（予定）" : "");
  $("routeHead").textContent = day.routeSummary || "行程";
  const chips = [];
  (day.prefectures || []).forEach(pf => {
    let t = "#" + pf.order + " " + pf.name + "：";
    if (pf.result === "goods") t += pf.chiikawa + "／" + (pf.gourmet ? pf.gourmet.dish : "");
    else if (pf.result === "planned") t += "予定（" + (pf.chiikawa || "") + "を探す）";
    else t += "グルメのみ（" + (pf.gourmet ? pf.gourmet.dish : "") + "）";
    chips.push(t);
  });
  if (day.stay) chips.push("宿泊：" + day.stay.name);
  $("dchips").innerHTML = chips.map(c => '<span class="chip">' + c + "</span>").join("");
  if (day.account){
    $("ledger").hidden = false;
    $("ledgerV").textContent = "運賃 ¥" + day.account.fare.toLocaleString() + " ＋ 宿泊 ¥" + day.account.lodging.toLocaleString() + " ＝ ¥" + day.account.total.toLocaleString();
    $("ledgerN").textContent = day.account.lodgingEstimate ? "宿泊費は目安です。グルメ・グッズ代は含みません。" : "グルメ・グッズ代は含みません。";
  } else $("ledger").hidden = true;
  liveMode = (day.date === todayStr());
  $("playPanel").style.display = liveMode ? "none" : "";
  $("liveNote").hidden = !liveMode;
  $("cardStatus").textContent = liveMode ? "ライブ" : day.date.slice(5).replace("-", "/") + "の旅";
  if (routeLine){ map.removeLayer(routeLine); routeLine = null; }
  if (doneLine){ map.removeLayer(doneLine); doneLine = null; }
  markers.forEach(m => map.removeLayer(m)); markers = [];
  const latlngs = stops.map(s => [s.lat, s.lng]);
  routeLine = L.polyline(latlngs, {color: "#c8a49e", weight: 4, opacity: .9}).addTo(map);
  doneLine = L.polyline([], {color: "#9e2b25", weight: 5, opacity: .95}).addTo(map);
  stops.forEach(s => {
    const mk = L.marker([s.lat, s.lng], {icon: staIcon(s), interactive: !!s.stop}).addTo(map);
    if (s.stop) mk.on("click", () => { if (!liveMode){ pause(); elapsed = s._t; render(); } });
    markers.push(mk);
  });
  pinTag = null;
  if (!pin){
    pin = L.marker(latlngs[0], {icon: L.divIcon({className: "maru-icon", html: maruIconHtml(stops[0].name), iconSize: [46, 46], iconAnchor: [23, 23]}), zIndexOffset: 1000}).addTo(map);
    pinTag = stops[0].name;
  }
  const sc = $("stopChips");
  sc.innerHTML = ""; chipEls = [];
  stops.filter(s => s.stop).forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.textContent = (s.time ? s.time + " " : "") + s.name;
    b.onclick = () => { if (!liveMode){ pause(); elapsed = s._t; render(); } };
    sc.appendChild(b);
    chipEls.push({el: b, stop: s});
  });
  const ph = $("photos");
  ph.innerHTML = "";
  const plist = day.photos || [];
  $("photoPanel").hidden = plist.length === 0;
  plist.forEach(p => {
    const img = document.createElement("img");
    img.src = PHOTO_BASE + p.file; img.alt = p.place; img.loading = "lazy";
    img.onclick = () => {
      if (!liveMode){
        const s = stops.find(x => x.stop && x.name === p.place);
        if (s){ pause(); elapsed = s._t; render(); }
      }
      $("ovimg").src = img.src; $("ovcap").textContent = p.place;
      $("overlay").style.display = "flex";
    };
    ph.appendChild(img);
  });
  if (fit){
    const b = routeLine.getBounds().pad(0.08);
    map.invalidateSize();
    setTimeout(() => { map.invalidateSize(); map.fitBounds(b); }, 60);
  }
  if (liveMode){
    elapsed = liveElapsed(day);
    render();
    liveTimer = setInterval(() => { elapsed = liveElapsed(day); render(); }, 15000);
  } else {
    render();
  }
}
$("ovclose").onclick = () => $("overlay").style.display = "none";
$("overlay").onclick = e => { if (e.target === $("overlay")) $("overlay").style.display = "none"; };
$("fitBtn").onclick = () => {
  const line = routeView ? allRouteLine : routeLine;
  if (line){ map.invalidateSize(); map.fitBounds(line.getBounds().pad(0.08)); }
};
$("liveReturnBtn").onclick = () => {
  if (!SAVE) return;
  let idx = SAVE.days.findIndex(d => d.date === todayStr());
  if (idx < 0) idx = SAVE.days.length - 1;
  if (idx !== curIdx) selectDay(idx, false);
  if (pin) map.setView(pin.getLatLng(), Math.max(map.getZoom(), 11), {animate: false});
};
let routeView = false, allRouteLine = null, curIdx = 0;
function enterRouteView(){
  if (!SAVE) return;
  routeView = true;
  pause();
  const pts = [];
  SAVE.days.forEach(d => d.stops.forEach(s => pts.push([s.lat, s.lng])));
  allRouteLine = L.polyline(pts, {color: "#9e2b25", weight: 4, opacity: .9}).addTo(map);
  document.body.classList.add("route-view");
  $("routeBanner").hidden = false;
  $("fullRouteBtn").setAttribute("aria-pressed", "true");
  map.invalidateSize();
  map.fitBounds(allRouteLine.getBounds().pad(0.05));
}
function exitRouteView(reselect = true){
  if (!routeView) return;
  routeView = false;
  if (allRouteLine){ map.removeLayer(allRouteLine); allRouteLine = null; }
  document.body.classList.remove("route-view");
  $("routeBanner").hidden = true;
  $("fullRouteBtn").setAttribute("aria-pressed", "false");
  if (reselect) selectDay(curIdx);
}
$("fullRouteBtn").onclick = () => routeView ? exitRouteView() : enterRouteView();
$("routeBanner").onclick = () => exitRouteView();
/* ---------- album ---------- */
let albumPhotos = [], lbIdx = 0;
function buildAlbum(){
  const q = SAVE.quest || {};
  albumPhotos = [];
  let total = 0;
  SAVE.days.forEach(d => { total += (d.photos || []).length; });
  let html = '<p class="pp-lead">旅先で撮った、まるの自撮り写真です。</p>';
  html += '<div class="pp-stats">' +
    '<span class="pp-stat">📷 <b>' + total + '</b><span>枚</span></span>' +
    '<span class="pp-stat">🗓 <b>' + SAVE.days.length + '</b><span>日分</span></span>' +
    '<span class="pp-stat">🗾 <b>' + (q.collected ?? "?") + "/" + (q.totalPrefectures ?? 47) + '</b><span>県</span></span></div>';
  const pct = (q.collected ?? 0) / (q.totalPrefectures ?? 47) * 100;
  html += '<div class="pp-progress"><div class="pp-progress-head"><b>全国制覇の進捗</b><small>グッズ ' + (q.goodsCollected ?? "?") + "県・グルメのみ " + (q.gourmetOnly ?? "?") + '県</small></div>' +
    '<div class="pp-bar"><i style="width:' + pct + '%"></i></div></div>';
  SAVE.days.forEach(d => {
    const ps = d.photos || [];
    if (!ps.length) return;
    html += '<section class="pp-day"><div class="pp-day-head"><h3>' + d.date.replace(/-/g, "/") + " " + d.title + '</h3><span class="pp-day-count">' + ps.length + '枚</span></div>' +
      '<p class="pp-day-sub">' + (d.routeSummary || "") + '</p><div class="pp-grid">';
    ps.forEach(p => {
      const gi = albumPhotos.length;
      albumPhotos.push({file: p.file, place: p.place, prefecture: p.prefecture, date: d.date, dayTitle: d.title});
      html += '<button type="button" class="pp-card" data-gi="' + gi + '"><img src="' + PHOTO_BASE + p.file + '" alt="' + p.place + '" loading="lazy"><span class="pp-card-body"><span class="pp-card-place">' + p.place + '</span><span class="pp-card-pref">' + (p.prefecture || "") + '</span></span></button>';
    });
    html += "</div></section>";
  });
  $("albumBody").innerHTML = html;
  $("albumBody").querySelectorAll(".pp-card").forEach(c => c.onclick = () => openLb(Number(c.dataset.gi)));
}
function openLb(i){
  lbIdx = i;
  const p = albumPhotos[i];
  $("lbImg").src = PHOTO_BASE + p.file;
  $("lbPlace").textContent = p.place;
  $("lbMeta").textContent = p.date.replace(/-/g, "/") + "　" + p.dayTitle + (p.prefecture ? "（" + p.prefecture + "）" : "");
  $("lbCounter").textContent = (i + 1) + " / " + albumPhotos.length;
  $("photoLb").hidden = false;
}
$("lbClose").onclick = () => $("photoLb").hidden = true;
$("lbPrev").onclick = () => openLb((lbIdx - 1 + albumPhotos.length) % albumPhotos.length);
$("lbNext").onclick = () => openLb((lbIdx + 1) % albumPhotos.length);
$("albumOpenBtn").onclick = () => { $("albumPanel").hidden = false; };
$("albumCloseBtn").onclick = () => { $("albumPanel").hidden = true; };
$("cardToggle").onclick = () => {
  const c = $("card");
  const compact = c.classList.toggle("compact");
  $("cardToggle").textContent = compact ? "カードを広げる" : "カードを縮める";
  $("cardToggle").setAttribute("aria-expanded", compact ? "false" : "true");
  setTimeout(() => map.invalidateSize(), 80);
};
$("sheetToggle").onclick = () => {
  const s = $("sheet");
  const collapsed = s.classList.toggle("collapsed");
  $("sheetToggle").textContent = collapsed ? "シートを開く" : "シートを閉じる";
  $("sheetToggle").setAttribute("aria-expanded", collapsed ? "false" : "true");
  setTimeout(() => map.invalidateSize(), 80);
};

function loadData(keepDate){
  fetch(SAVE_URL, {cache: "no-store"}).then(r => r.json()).then(data => {
    SAVE = data;
    buildAlbum();
    const q = data.quest || {};
    $("quest").textContent = "全国制覇 " + (q.collected ?? "?") + "/" + (q.totalPrefectures ?? 47) +
      "県（グッズ " + (q.goodsCollected ?? "?") + "県・グルメのみ " + (q.gourmetOnly ?? "?") + "県）　更新：" +
      (data.updatedAt || "").slice(0,10);
    const sel = $("daysel");
    sel.innerHTML = "";
    data.days.forEach((d, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = d.date.replace(/-/g, "/") + " " + (d.prefectures && d.prefectures[0] ? d.prefectures[0].name : "") +
        (d.date === todayStr() ? "（今日）" : "") + (d.status === "planned" ? "（予定）" : "");
      sel.appendChild(o);
    });
    sel.onchange = () => selectDay(Number(sel.value));
    let idx = keepDate ? data.days.findIndex(d => d.date === keepDate) : -1;
    if (idx < 0) idx = data.days.findIndex(d => d.date === todayStr());
    if (idx < 0) idx = data.days.length - 1;
    selectDay(idx);
  }).catch(e => { $("sheetTitle").textContent = "セーブデータを読み込めませんでした：" + e; });
}
loadData(null);
$("reload").onclick = () => loadData(day ? day.date : null);
$("follow").onclick = () => {
  following = !following;
  $("follow").setAttribute("aria-pressed", following ? "true" : "false");
  $("follow").textContent = following ? "カメラ追従：オン" : "カメラ追従：オフ";
  if (following) render();
};
</script>
</body>
</html>
